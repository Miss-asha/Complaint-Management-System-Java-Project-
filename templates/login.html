{% extends "base.html" %}
{% block title %}Login - Complaint Portal{% endblock %}
{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center mb-4 text-primary"><i class="bi bi-shield-lock me-2"></i>Sign In</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username or Email</label>
                        <input type="text" name="username" class="form-control" placeholder="username or user@nhitm.ac.in" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
                </form>
                <div class="text-center mt-3 small">
                    Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
