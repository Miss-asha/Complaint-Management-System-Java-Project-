{% extends "base.html" %}
{% block title %}Register - Complaint Portal{% endblock %}
{% block content %}
<div class="row justify-content-center pt-3">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center mb-4 text-primary"><i class="bi bi-person-plus me-2"></i>Create Account</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="johndoe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">College Email</label>
                            <input type="email" name="email" class="form-control" placeholder="name@nhitm.ac.in" required>
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Branch</label>
                            <select name="branch" class="form-select" required>
                                <option value="Computer Engineering">Computer Engineering</option>
                                <option value="AI & Data Science">AI & Data Science</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Year of Study</label>
                            <select name="year" class="form-select">
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
                </form>
                <div class="text-center mt-3 small">
                    Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
